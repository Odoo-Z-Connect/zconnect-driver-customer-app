name: zconnect
description: ZConnect – Parcel Delivery & Logistics App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  smooth_page_indicator: ^1.2.0+3
  animations: ^2.0.11
  stylish_bottom_bar: ^1.1.0
  font_awesome_flutter: ^11.0.0
  intl: ^0.19.0
  uuid: ^4.5.1
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.2.2
  google_maps_flutter: ^2.18.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#3DB64C"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
